<div class="register-container">
  <h2>Crear una Cuenta</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="username">Usuario</label>
      <input id="username" type="text" formControlName="username">
      <div *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.errors?.['required']" class="error-text">
        El nombre de usuario es requerido.
      </div>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password">
       <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['required']" class="error-text">
        La contraseña es requerida.
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmar Contraseña</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword">
      <div *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.errors?.['mismatch']" class="error-text">
        Las contraseñas no coinciden.
      </div>
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Registrarse</button>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

     
    <div class="register-link" style="text-align: center; margin-top: 15px;">
  <p>
    Ya tienes una cuenta?
    <a routerLink="/login">Inicia sesión aquí</a>
  </p>
</div>
  </form>
</div>
